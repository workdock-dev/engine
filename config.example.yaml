# Copy to config.yaml at the repository root and replace the placeholders.
# The single-node Compose deployment mounts this file read-only into the
# engine and recreates the container automatically when it changes.
# Also place the GitHub App private key at ./github-app.pem.

# *---------------------------------------------------------------------------*
# * APPLICATION CONFIGURATION                                                 *
# *---------------------------------------------------------------------------*

service_name: "workdock"
server_address: ":8080"

task_scheduler:
  workers: 3
  max_attempts: 2

harness_liveness_probe:
  max_misses: 3
  period_seconds: 30

mcps:
  - name: "My MCP"
    url: "https://example.com"
    auth_key: "MY_MCP_AUTH_SECRET_ENV_VAR_NAME"
    auth_secret: "your-mcp-api-key"
    hosts: ["example.com"]

# *---------------------------------------------------------------------------*
# * PLUGINGS CONFIGURATION                                                    *
# *---------------------------------------------------------------------------*

linear:
  server_url: "http://localhost:8080"
  api_url: "https://api.linear.app/graphql"
  token_url: "https://api.linear.app/oauth/token"
  webhook_secret: "replace-with-linear-webhook-secret"
  client_id: "replace-with-linear-client-id"
  client_secret: "replace-with-linear-client-secret"
  ips:
    - "35.231.147.226"
    - "35.243.134.228"
    - "34.140.253.14"
    - "34.38.87.206"
    - "34.134.222.122"
    - "35.222.25.142"

daytona:
  api_url: "https://app.daytona.io/api"
  api_key: "replace-with-daytona-api-key"
  target: "us"
  secrets:
    - name: OPENROUTER_API_KEY
      value: replace-with-openrouter-api-key
      hosts: ["*.openrouter.ai"]

opencode:
  version: 1.18.27
  model: openrouter/openai/gpt-oss-20b:free
  permission:
    "external_directory": "deny"
    "*": "allow"
  provider:
    openrouter:
      options:
        apiKey: "{env:OPENROUTER_API_KEY}"
      models:
        openai/gpt-oss-20b:free: {}

# pi.dev coding harness (https://pi.dev). Tools maps to pi's --tools
# allowlist of built-in tools; omit it to use the default
# read, bash, edit, grep, find, ls, write.
#
# provider declares a custom provider in ~/.pi/agent/models.json for
# OpenAI-compatible endpoints that pi does not ship (e.g. Ollama Cloud).
# api_key supports pi's value syntax including "$ENV_VAR" interpolation; the
# environment variable is provided by the daytona secrets below. Omit the
# provider block to select a built-in provider (e.g. openrouter) whose key
# resolves from the sandbox environment.
pidev:
  version: 0.85.1
  # thinking_level: "high"
  tools:
    - "read"
    - "bash"
    - "edit"
    - "grep"
    - "find"
    - "ls"
    - "write"
  provider:
    name: "ollama"
    base_url: "https://ollama.com/v1"
    api: "openai-completions"
    api_key: "$OLLAMA_API_KEY"
    models:
      - id: "glm-5.3-flash:cloud"
        context_window: 128000

github:
  bot_login_id: "workdock[bot]"
  client_id: "replace-with-github-app-client-id"
  private_key_path: "/app/config/github-app.pem"
  webhook_secret: "replace-with-github-webhook-secret"
  app_install_url: "https://github.com/apps/your-app-name/installations/new"

# *---------------------------------------------------------------------------*
# * INFRASTRUCTURE CONFIGURATION                                              *
# *---------------------------------------------------------------------------*

# Exactly one secrets provider must be configured. infisical and
# in_memory_secrets are mutually exclusive with each other and with
# file_secrets. If none is set, a non-persistent in-memory store is used and
# a warning is logged.

file_secrets:
  root_dir: "/app/data/secrets"

# infisical:
