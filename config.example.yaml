server_address: ":8080"
workers: 3
sandbox_creation_retries: 1

# When NOT set defaults to infisical
# secrets:
#   mode: memory
#   memory_secrets: {}

linear:
  server_url: "your-sever-url"
  api_url: "https://api.linear.app/graphql"
  token_url: "https://api.linear.app/oauth/token"
  webhook_secret: "your-webhook-secret"
  client_id: "your-client-id"
  client_secret: "your-client-secret"
  ips:
    - "35.231.147.226"
    - "35.243.134.228"
    - "34.140.253.14"
    - "34.38.87.206"
    - "34.134.222.122"
    - "35.222.25.142"

daytona:
  api_url: "https://app.daytona.io/api"
  api_key: "your-api-key"
  target: "us"

opencode:
  destroy_on_dispose: false
  liveness_timeout_seconds: 30
  max_health_misses: 3
  model: openrouter/openai/gpt-oss-20b:free
  permission:
    "external_directory": "deny"
    "*": "allow"
  secrets: # if possible by the sandbox, will be configured as a secret e.g. https://www.daytona.io/docs/secrets
    OPENROUTER_API_KEY:
      value: your-secret-api-key
      hosts: ["*.openrouter.ai"]
  provider:
    openrouter:
      options:
        apiKey: "{env:OPENROUTER_API_KEY}"
      models:
        openai/gpt-oss-20b:free: {}

infisical:
  client_id: "your-client-id"
  client_secret: "your-client-secret"
  project_id: "your-project-id"
  environment: "dev"
  site_url: "https://app.infisical.com"

postgres:
  database_url: "postgresql://postgres:postgres@127.0.0.1:5432/workdock"

github:
  bot_login_id: "workdock[bot]"
  client_id: "your-client-id"
  private_key_path: "./github-app.pem"
  webhook_secret: "your-webhook-secret"
  app_install_url: "https://github.com/apps/your-app-name/installations/new"

